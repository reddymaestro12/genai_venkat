[project]
name = "genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reddymaestro12", email = "reddymaestro12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gensim>=4.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "scikit-learn>=1.9.1",
]

[project.scripts]
genai = "genai:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
